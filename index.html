<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guillaume — Carte de visite</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f3ef;
      color: #222;
    }

    .card {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 50px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile {
      text-align: center;
      margin-bottom: 35px;
    }

    .profile h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    .profile p {
      margin-top: 10px;
      font-size: 17px;
      color: #666;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      display: block;
      padding: 16px 20px;
      background: white;
      color: #222;
      text-decoration: none;
      text-align: center;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .contact {
      background: #222;
      color: white;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="card">

    <section class="profile">
      <h1>Guillaume</h1>
      <p>Communication digitale & création de contenu</p>
    </section>

    <section class="buttons">

      <a class="button contact" href="#">
        + Ajouter mes coordonnées
      </a>

      <a class="button" href="mailto:TONEMAIL">
        ✉️ M'envoyer un e-mail
      </a>

      <a class="button" href="tel:TONTELEPHONE">
        📞 M'appeler
      </a>

      <a class="button" href="#">
        LinkedIn
      </a>

    </section>

    <div class="footer">
      Carte de visite numérique
    </div>

  </main>

</body>
</html>
